# Echidna campaign against the patched token.
# Run: echidna . --contract MemeTaxFixedEchidna --config echidna.yaml

# The four properties are view functions starting with `echidna_` that must
# stay true after every call, same idea as a Foundry invariant.
testMode: property

# Long sequences help here: INV-02 only breaks if fees and dividends are added
# and then claimed in an order that leaves one of them without ETH behind it.
seqLen: 100
testLimit: 50000
shrinkLimit: 5000

# Saves the sequences that reached new code, plus `covered.*.txt`. That file is
# how I check coverage, since Echidna doesn't print a call summary.
corpusDir: echidna-corpus

# No cheatcodes, so the ETH for `fundRouter` and `depositDividend` comes from
# the harness balance. 100,000 ETH, same as the vm.deal in the Foundry setup.
balanceContract: 100000000000000000000000

# Only the harness gets fuzzed. The Puppets are there to give calls a different
# sender, not to be called directly.
allContracts: false

# crytic-compile skips `test/` for Foundry projects by default, and the harness is in there.
cryticArgs: ["--foundry-compile-all"]
