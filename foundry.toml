[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
verbosity = 2

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"

[invariant]
runs = 256
depth = 128
fail_on_revert = false
shrink_run_limit = 5000

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
