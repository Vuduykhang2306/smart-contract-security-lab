name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: forge test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show versions
        run: forge --version

      - name: Build
        run: forge build --sizes

      - name: Run exploits, retests and the invariant campaign
        run: forge test -vv --no-match-path "test/fork/*"

      - name: Run mainnet-fork review PoCs
        run: forge test -vv --match-path "test/fork/*"
        env:
          ETH_RPC_URL: https://ethereum-rpc.publicnode.com
        continue-on-error: true

      - name: Lint
        run: forge lint || true

  echidna:
    name: echidna
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install crytic-compile
        run: pipx install crytic-compile

      - name: Install Echidna
        run: |
          curl -sL https://github.com/crytic/echidna/releases/download/v2.3.3/echidna-2.3.3-x86_64-linux.tar.gz \
            | tar -xz -C /usr/local/bin
          echidna --version

      # The properties have to hold on the patched contract.
      - name: Campaign against the remediated contract
        run: echidna . --contract MemeTaxFixedEchidna --config echidna.yaml --format text

      # And they have to break on the unpatched one, or the run above proves
      # nothing. Both named properties must fail: a control that only trips the
      # tax cap would hide the harness having gone blind to H-04.
      - name: Negative control - the same properties must fail on the unpatched contract
        run: |
          echidna . --contract MemeTaxEchidna --config echidna.control.yaml --format text \
            > control.log 2>&1 || true
          cat control.log
          for prop in echidna_ethObligationsAreBacked echidna_taxNeverExceedsCap; do
            grep -q "$prop: failed" control.log || {
              echo "::error::$prop did not fail on the unpatched contract."; exit 1; }
          done
          for prop in echidna_supplyIsConserved echidna_maxWalletHasFloor; do
            grep -q "$prop: passing" control.log || {
              echo "::error::$prop was expected to hold even unpatched."; exit 1; }
          done
          echo "Control behaved as documented."
