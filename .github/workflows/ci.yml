name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: forge test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show versions
        run: forge --version

      - name: Build
        run: forge build --sizes

      - name: Run exploits, retests and the invariant campaign
        run: forge test -vv --no-match-path "test/fork/*"

      - name: Run mainnet-fork review PoCs
        run: forge test -vv --match-path "test/fork/*"
        env:
          ETH_RPC_URL: https://ethereum-rpc.publicnode.com
        continue-on-error: true

      - name: Lint
        run: forge lint || true
